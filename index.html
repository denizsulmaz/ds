<!DOCTYPE html>

<head>

    <link rel="stylesheet" href="style.css?v=1.1">
    <style>
        /* Extra styles specifically for the Portal Landing page to keep it clean */
        .portal-hero {
            height: 100vh;
            width: 100vw;
            position: relative;
            background-color: #000000;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .portal-content {
            z-index: 9;
            position: relative;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
        }

        .portal-header {
            margin-bottom: 4rem;
        }

        .portal-header h1 {
            font-size: 5.5rem !important;
            position: relative !important;
            bottom: unset !important;
            margin-bottom: 1rem;
            font-weight: 800;
            letter-spacing: 3px;
            text-shadow: none;
            color: #ffffff;
            line-height: 1.2;
        }

        .portal-logo-wrapper {
            margin-bottom: 2rem;
            display: flex;
            justify-content: center;
        }

        .portal-logo-wrapper svg {
            fill: #ffffff;
        }

        .portal-logo-wrapper rect {
            fill: #ffffff;
        }

        .portal-logo-wrapper path {
            fill: #000000;
        }

        .portal-footer {
            margin-top: 5rem;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.85rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: center;
        }

        .portal-socials {
            display: flex;
            gap: 1.5rem;
        }

        .portal-socials a {
            color: rgba(255, 255, 255, 0.6);
            font-size: 1.2rem;
            transition: color 0.3s ease;
        }

        .portal-socials a:hover {
            color: #ffffff;
        }

        /* Unified sharp border grid layout for the options */
        .gateway-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            width: 100vw;
            min-width: 100vw;
            max-width: 100vw;
            margin: 3rem calc(-50vw + 50%);
            border-top: 1px solid rgba(255, 255, 255, 0.25);
            border-bottom: 1px solid rgba(255, 255, 255, 0.25);
            gap: 0;
            padding: 0;
        }

        .gateway-option {
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            height: 480px;
            background: transparent !important;
            border: none !important;
            border-right: 1px solid rgba(255, 255, 255, 0.25) !important;
            border-radius: 0 !important;
            max-width: none !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            color: rgba(255, 255, 255, 0.6) !important;
            font-family: 'Branch', serif !important;
            font-size: 2.2rem;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: none;
            text-decoration: none;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            cursor: pointer;
            box-shadow: none !important;
            transform: none !important;
        }

        .gateway-option:first-child {
            border-left: 1px solid rgba(255, 255, 255, 0.25) !important;
        }

        .gateway-option:hover {
            color: #ffffff !important;
            background-color: rgba(255, 255, 255, 0.03) !important;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.6);
            transform: none !important;
            box-shadow: none !important;
        }

        @media (max-width: 768px) {
            .gateway-container {
                grid-template-columns: 1fr;
                width: 100vw;
                min-width: 100vw;
                max-width: 100vw;
                border-top: 1px solid rgba(255, 255, 255, 0.25);
                border-bottom: none;
                margin: 2rem calc(-50vw + 50%);
            }
            .gateway-option {
                height: 120px;
                font-size: 1.6rem;
                border-right: none !important;
                border-left: none !important;
                border-bottom: 1px solid rgba(255, 255, 255, 0.25) !important;
            }
            .gateway-option:first-child {
                border-left: none !important;
            }
        }
    </style>
</head>
