    <style>
        /* Extra styles specifically for the Portal Landing page to keep it clean */
        /* The gateway is a single screen: never scrolls, at any viewport size */
        html, body {
            overflow: hidden;
        }

        .portal-hero {
            height: 100vh;
            height: 100svh;
            width: 100vw;
            position: relative;
            background-color: #000000;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .portal-content {
            z-index: 9;
            position: relative;
            max-width: 1200px;
            width: 100%;
            /* full height so the footer can pin to the bottom of the screen */
            height: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
        }

        .portal-header {
            margin-bottom: 4rem;
        }

        .portal-header h1 {
            font-size: 5.5rem !important;
            position: relative !important;
            bottom: unset !important;
            margin-bottom: 1rem;
            font-weight: 800;
            letter-spacing: 3px;
            text-shadow: none;
            color: #ffffff;
            line-height: 1.2;
        }

        /* Softer particle field on the gateway */
        .portal-hero canvas {
            opacity: 0.42;
        }

        .portal-logo-wrapper {
            margin-top: 2vh;
            margin-bottom: 2vh;
            display: flex;
            justify-content: center;
        }

        .portal-logo-wrapper svg {
            fill: #ffffff;
        }

        .portal-logo-wrapper rect {
            fill: #ffffff;
        }

        .portal-logo-wrapper path {
            fill: #000000;
        }

        /* Pinned to the bottom edge of the single screen */
        .portal-footer {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 3vh;
            margin-top: 0;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.85rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: center;
        }

        .portal-socials {
            display: flex;
            gap: 1.5rem;
        }

        .portal-socials a {
            color: rgba(255, 255, 255, 0.6);
            font-size: 1.2rem;
            transition: color 0.3s ease;
        }

        .portal-socials a:hover {
            color: #ffffff;
        }

        /* Borderless three-way gateway */
        .gateway-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            width: 100vw;
            min-width: 100vw;
            max-width: 100vw;
            margin: 3vh calc(-50vw + 50%);
            gap: 0;
            padding: 0;
        }

        .gateway-option {
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            height: 40vh;
            padding: 0 !important;
            background: transparent !important;
            border: none !important;
            border-radius: 0 !important;
            max-width: none !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            color: rgba(255, 255, 255, 0.6) !important;
            font-family: 'Branch', serif !important;
            font-size: clamp(1.6rem, 3.4vw, 3.6rem);
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: none;
            text-decoration: none;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            cursor: pointer;
            box-shadow: none !important;
            transform: none !important;
        }

        .gateway-option:hover {
            color: #ffffff !important;
            background-color: transparent !important;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.6);
            transform: none !important;
            box-shadow: none !important;
        }

        /* style.css turns the portal into an auto-height, padded block below 900px;
           override it so the single-screen rule survives */
        @media (max-width: 900px) {
            .portal-hero {
                height: 100svh !important;
                min-height: 0 !important;
                padding: 0 !important;
            }
            .portal-content {
                padding: 1rem;
                height: 100%;
                justify-content: center;
            }
            .gateway-container {
                grid-template-columns: 1fr;
                width: 100vw;
                min-width: 100vw;
                max-width: 100vw;
                margin: 2vh calc(-50vw + 50%);
                gap: 0 !important;
            }
            .gateway-option {
                width: 100%;
                height: 13vh;
                min-height: 62px;
                font-size: clamp(1.5rem, 7vw, 2.4rem);
            }
            .portal-logo-wrapper {
                margin-top: 0;
                margin-bottom: 1vh;
            }
            .portal-logo-wrapper svg {
                width: 28px;
                height: 48px;
            }
            .portal-footer {
                bottom: 2.5vh;
                gap: 0.6rem;
            }
        }

        /* Short landscape screens: keep everything inside the fold */
        @media (max-height: 620px) {
            .gateway-option {
                height: 12vh;
                min-height: 48px;
                font-size: clamp(1.2rem, 5vw, 1.8rem);
            }
            .portal-footer {
                bottom: 1.5vh;
                font-size: 0.75rem;
            }
            .portal-socials a {
                font-size: 1rem;
            }
        }
    </style>
</head>
